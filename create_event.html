{% extends "base.html" %}

{% block title %}Создать событие — Dobro.Letovo{% endblock %}

{% block content %}
    <section class="card">
        <h1>Создание нового события</h1>
        <form method="post" action="/create">
            <label for="title">Название события:</label>
            <input type="text" id="title" name="title" placeholder="Например: Эко-субботник" required>

            <label for="date">Дата проведения:</label>
            <input type="date" id="date" name="date" required>

            <label for="location">Место проведения:</label>
            <input type="text" id="location" name="location" placeholder="Например: Школьный двор" required>

            <label for="capacity">Количество участников:</label>
            <input type="number" id="capacity" name="capacity" min="1" required>

            <label for="category">Категория:</label>
            <select id="category" name="category">
                <option value="эко">Эко-акции</option>
                <option value="спорт">Спорт</option>
                <option value="культура">Культура</option>
                <option value="образование">Образование</option>
            </select>

            <label for="description">Описание события:</label>
            <textarea id="description" name="description" rows="5" placeholder="Расскажите подробнее о событии..." required></textarea>

            <button type="submit" class="btn btn-primary">Создать событие</button>
        </form>
    </section>
{% endblock %}
