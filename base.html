<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dobro.Letovo{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="layout">
    <!-- Боковое меню -->
    <aside class="sidebar">
        <div class="logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Летово">
        </div>
        <nav class="menu">
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('events') }}">Мероприятия</a>
            <a href="#">Избранное</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('profile', user_id=current_user.id) }}">Профиль</a>
                <a href="{{ url_for('logout') }}">Выйти</a>
            {% else %}
                <a href="{{ url_for('login_test') }}">Войти</a>
                <a href="{{ url_for('register') }}">Регистрация</a>
            {% endif %}
        </nav>
    </aside>

    <!-- Основной контент -->
    <main class="content">
        <header class="topbar">
            <h1 class="site-title">Dobro.Letovo</h1>
            <div class="profile">
                <span>Тестов Т.</span>
                <a href="#">Выйти</a>
            </div>
        </header>

        <div class="page">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>
</body>
</html>
